name: Watchlist check

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30.
    - cron: "*/5 3-10 * * 1-5"       # every 5 min, 08:30-16:25 IST, Mon-Fri (market hours)
    - cron: "0 0,12,15,18,21 * * 1-5" # every 3 hours outside market hours: 17:30, 20:30, 23:30, 02:30, 05:30 IST
    - cron: "0 */3 * * 0,6"           # every 3 hours on weekends
  workflow_dispatch: {}              # "Run workflow" button for a manual check

concurrency:
  group: watchlist-repo-write        # never two runs writing state at once
  cancel-in-progress: false

permissions:
  contents: write                    # lets the run commit state, logs and PDFs back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check NSE for watchlist filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGES: "NSE"   # BSE blocks GitHub's servers; BSE runs on your PC (bse_offline.bat)
          SAVE_PDFS: "0"   # PDFs go to Telegram; keep the repo small. Use sync-pdfs on your PC.
        run: python watchlist_alerts.py check

      - name: Save state and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state logs 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Watchlist update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
