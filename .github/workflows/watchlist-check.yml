name: Watchlist check

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30.
    - cron: "*/5 3-10 * * 1-5"       # every 5 min, 08:30-16:25 IST, Mon-Fri (market hours)
    - cron: "*/30 0-2,11-23 * * 1-5" # every 30 min outside market hours
    - cron: "0 */2 * * 0,6"          # every 2 hours on weekends
  workflow_dispatch: {}              # "Run workflow" button for a manual check

concurrency:
  group: watchlist-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check NSE + BSE for watchlist filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAVE_PDFS: "0"
        run: python watchlist_alerts.py check

      - name: Save state and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state logs 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Watchlist update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
