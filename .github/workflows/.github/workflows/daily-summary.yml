name: Daily summary

on:
  schedule:
    - cron: "30 16 * * *"            # 22:00 IST every day
  workflow_dispatch: {}

concurrency:
  group: watchlist-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send daily summary on Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchlist_alerts.py summary

      - name: Save summary time (also keeps the schedule from being paused)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily summary sent $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
